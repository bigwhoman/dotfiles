# hypridle - replaces the previous swayidle one-liner in hyprland.conf.
# Same timings as before: screen off @5min, lock @10min, suspend @15min.
# Locker is swaylock; hyprlock is not installed.

general {
    lock_cmd = pidof swaylock || swaylock -f
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min - blank the OLED. This is the listener that actually matters for
# battery: before any idle daemon existed, the panel never turned off.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min - lock the session (triggers lock_cmd above)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min - suspend (s2idle on this machine)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
