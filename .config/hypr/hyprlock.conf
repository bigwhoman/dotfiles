# Plain colour background on purpose: `path = screenshot` + blur is a known
# source of hyprlock hangs on NVIDIA.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(89b4fa)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    placeholder_text = Password...
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    color = rgb(cdd6f4)
    position = 0, 80
    halign = center
    valign = center
}
